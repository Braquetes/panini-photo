<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundial Social - Tabla de archivos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: #f8f9fc;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .table th {
            background-color: #2c3e66;
            color: white;
            font-weight: 500;
            border: none;
        }

        .table td {
            vertical-align: middle;
        }

        .btn-ver {
            padding: 0.25rem 0.75rem;
            border-radius: 2rem;
            font-size: 0.8rem;
        }

        .id-col {
            font-weight: 600;
            color: #2c3e66;
        }

        .ruta-col {
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            word-break: break-all;
        }

        footer {
            font-size: 0.8rem;
            border-top: 1px solid #e3e6f0;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-light bg-white shadow-sm">
        <div class="container">
            <span class="navbar-brand">
                <i class="bi bi-table me-2"></i> Mundial Social · DIF Oaxaca
            </span>
            <button class="btn btn-outline-secondary btn-sm" id="btnRefrescar">
                <i class="bi bi-arrow-clockwise"></i> Recargar
            </button>
        </div>
    </nav>

    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 fw-semibold mb-0"><i class="bi bi-folder2-open me-1"></i> Lista de archivos</h2>
            <span class="badge bg-secondary" id="contadorBadge">Cargando...</span>
        </div>

        <div id="errorMsg" class="alert alert-danger d-none" role="alert"></div>

        <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle" id="tablaArchivos">
                <thead>
                    <tr>
                        <th style="width: 80px">ID</th>
                        <th>Documento / Tipo</th>
                        <th>Ruta del archivo</th>
                        <th style="width: 100px">Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaBody">
                    <tr>
                        <td colspan="4" class="text-center py-4">
                            <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                            Cargando datos...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <footer class="text-center text-muted py-3">
        <small>Ordenado por ID (más reciente primero) | Los datos se obtienen directamente desde la API</small>
    </footer>

    <script>
        const API_URL = "https://apifilemanager.difoaxaca.gob.mx/mundial_social/03062026";
        const tablaBody = document.getElementById("tablaBody");
        const contadorBadge = document.getElementById("contadorBadge");
        const errorDiv = document.getElementById("errorMsg");
        const btnRefrescar = document.getElementById("btnRefrescar");

        function construirUrlImagen(ruta) {
            // La ruta viene como "mundial_social/03062026/archivo.png"
            // Se concatena con el dominio base
            return "https://apifilemanager.difoaxaca.gob.mx/" + ruta;
        }

        async function cargarTabla() {
            // Mostrar loading
            tablaBody.innerHTML = `
                <tr>
                    <td colspan="4" class="text-center py-4">
                        <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                        Cargando datos desde el servidor...
                    </td>
                </tr>
            `;
            errorDiv.classList.add("d-none");
            contadorBadge.textContent = "Cargando...";
            contadorBadge.className = "badge bg-secondary";

            try {
                const response = await fetch(API_URL);
                if (!response.ok) {
                    throw new Error(`Error HTTP ${response.status}: ${response.statusText}`);
                }
                const data = await response.json();

                // Validar estructura
                if (!data || !Array.isArray(data.archivos)) {
                    throw new Error("La respuesta no contiene un array 'archivos' válido.");
                }

                let archivos = data.archivos;

                if (archivos.length === 0) {
                    tablaBody.innerHTML = `
                        <tr>
                            <td colspan="4" class="text-center py-4 text-muted">
                                <i class="bi bi-inbox fs-4"></i><br>No se encontraron archivos
                            </td>
                        </tr>
                    `;
                    contadorBadge.textContent = "0 elementos";
                    contadorBadge.className = "badge bg-secondary";
                    return;
                }

                // ORDENAR por ID de MAYOR a MENOR (el más grande arriba)
                archivos.sort((a, b) => b.Id - a.Id);

                // Actualizar badge con cantidad
                contadorBadge.textContent = `${archivos.length} elemento(s) · ID ↓`;
                contadorBadge.className = "badge bg-primary";

                // Construir filas de la tabla
                let filasHtml = "";
                for (const item of archivos) {
                    const id = item.Id;
                    const documento = item.Documento || "sin tipo";
                    const ruta = item.Ruta;
                    const urlCompleta = construirUrlImagen(ruta);
                    // Extraer solo el nombre del archivo para mostrar más legible
                    const nombreArchivo = ruta.split('/').pop();

                    filasHtml += `
                        <tr>
                            <td class="id-col text-center fw-bold">${id}</td>
                            <td>
                                <span class="badge bg-light text-dark border px-3 py-2">
                                    <i class="bi bi-file-image me-1"></i> ${documento}
                                </span>
                            </td>
                            <td class="ruta-col">
                                <code class="small">${ruta}</code>
                                <br><small class="text-muted">📄 ${nombreArchivo}</small>
                            </td>
                            <td class="text-center">
                                <a href="${urlCompleta}" target="_blank" class="btn btn-sm btn-outline-primary btn-ver">
                                    <i class="bi bi-eye"></i> Ver
                                </a>
                            </td>
                        </tr>
                    `;
                }

                tablaBody.innerHTML = filasHtml;

            } catch (error) {
                console.error("Error:", error);
                errorDiv.classList.remove("d-none");
                errorDiv.innerHTML = `<i class="bi bi-exclamation-triangle-fill me-2"></i> Error al cargar: ${error.message}. Verifica la conexión o CORS.`;
                tablaBody.innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center py-4">
                            <button class="btn btn-primary btn-sm" onclick="location.reload()">
                                <i class="bi bi-arrow-repeat"></i> Reintentar
                            </button>
                        </td>
                    </tr>
                `;
                contadorBadge.textContent = "Error";
                contadorBadge.className = "badge bg-danger";
            }
        }

        // Botón refrescar manual
        btnRefrescar.addEventListener("click", () => {
            cargarTabla();
        });

        // Cargar al inicio
        cargarTabla();
    </script>
</body>

</html>
