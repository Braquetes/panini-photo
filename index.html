<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Foto IA - Cámara Inteligente</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f7fa;
      min-height: 100vh;
    }

    h2 {
      color: #1a2c3e;
      margin-bottom: 16px;
      font-weight: 600;
    }

    .backend-config {
      margin-bottom: 16px;
    }

    .backend-config label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #5c6f87;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .backend-config input {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 14px;
      font-family: monospace;
      background: white;
    }

    .option-selector {
      margin-bottom: 12px;
    }

    .option-selector label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #5c6f87;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .option-selector select {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 14px;
      background: white;
      font-family: inherit;
      cursor: pointer;
      font-weight: 500;
    }

    .camera-selector {
      margin-bottom: 12px;
    }

    .camera-selector label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #5c6f87;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .camera-selector select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 14px;
      background: white;
      font-family: inherit;
      cursor: pointer;
    }

    .video-container {
      position: relative;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 12px;
      aspect-ratio: 4 / 3;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .timer-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      border-radius: 16px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .timer-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .timer-number {
      font-size: 80px;
      font-weight: bold;
      color: white;
      background: rgba(0, 0, 0, 0.6);
      width: 120px;
      height: 120px;
      border-radius: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: monospace;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      cursor: pointer;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 40px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .status {
      margin-top: 16px;
      padding: 10px;
      border-radius: 12px;
      font-size: 14px;
      text-align: center;
      background: #f1f5f9;
      color: #475569;
    }

    .status.error {
      background: #fee2e2;
      color: #dc2626;
    }

    .status.success {
      background: #dcfce7;
      color: #16a34a;
    }

    .status.info {
      background: #dbeafe;
      color: #2563eb;
    }

    .status.warning {
      background: #fef3c7;
      color: #d97706;
    }

    .result-container {
      margin-top: 20px;
      display: none;
    }

    .file-upload-btn {
      background: #64748b;
      margin-top: 8px;
    }

    .camera-info {
      font-size: 11px;
      text-align: center;
      margin-top: 8px;
      color: #5c6f87;
    }

    .selected-option {
      margin-top: 8px;
      padding: 8px;
      background: #e0e7ff;
      border-radius: 8px;
      font-size: 12px;
      text-align: center;
      color: #3730a3;
      display: none;
    }

    /* Modal para nombre y fecha */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      margin: 20px;
      padding: 24px;
      border-radius: 24px;
      max-width: 350px;
      width: 100%;
    }

    .modal-content h3 {
      margin-bottom: 20px;
      text-align: center;
    }

    .modal-content input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1.5px solid #e2e8f0;
      margin-bottom: 12px;
      font-size: 16px;
    }

    .modal-content button {
      margin-top: 8px;
    }

    .id-info {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: #1e293b;
      color: white;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      text-align: center;
      z-index: 100;
      display: none;
    }

    .id-info.show {
      display: block;
    }

    /* Estilos para la tarjeta Panini */
    .card-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 1.5rem 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
    }

    .card-container {
      position: relative;
      width: 340px;
      height: 460px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.18);
    }

    .card-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .card-fallback {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #5ecfcc 0%, #3bb8b5 100%);
      z-index: 0;
    }

    .card-player-img {
      position: absolute;
      bottom: 90px;
      left: 30px;
      width: 280px;
      min-height: 330px;
      border-radius: 14px;
      object-fit: contain;
      z-index: 2;
      pointer-events: none;
      user-select: none;
    }

    .overlay-name {
      position: absolute;
      bottom: 56px;
      left: 32px;
      right: 110px;
      border-radius: 20px;
      text-align: center;
      padding: 7px 10px;
      font-family: 'Arial Black', Arial, sans-serif;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 1px;
      color: #fff;
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
      width: 200px;
      z-index: 3;
      background: rgba(0, 0, 0, 0.5);
    }

    .overlay-dob {
      position: absolute;
      bottom: 26px;
      left: 32px;
      width: 140px;
      border-radius: 14px;
      text-align: center;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.5px;
      pointer-events: none;
      user-select: none;
      z-index: 3;
      background: rgba(0, 0, 0, 0.5);
    }

    .btn-descargar {
      background: #10b981;
      margin-top: 8px;
    }

    .btn-descargar:hover {
      background: #059669;
    }
  </style>
</head>

<body>

  <h2>📸 Foto IA</h2>

  <div class="backend-config">
    <label>🔗 Backend URL</label>
    <input id="backend" value="https://api-gemini.difoaxaca.gob.mx" placeholder="https://api-gemini.difoaxaca.gob.mx">
  </div>

  <div class="option-selector">
    <label>🎨 Seleccionar efecto</label>
    <select id="optionSelect">
      <option value="panini">🃏 CARTA PANINI</option>
      <option value="messi">🐐 FOTO CON MESSI</option>
      <option value="cristiano">👑 FOTO CON CRISTIANO RONALDO</option>
      <option value="mbappe">⚡ FOTO CON MBAPPÉ</option>
    </select>
    <div class="selected-option" id="selectedOptionMsg"></div>
  </div>

  <div class="camera-selector">
    <label>🎥 Seleccionar cámara</label>
    <select id="cameraSelect" disabled>
      <option value="">🔍 Detectando cámaras...</option>
    </select>
    <div class="camera-info" id="cameraInfo"></div>
  </div>

  <div class="video-container">
    <video id="video" autoplay playsinline muted></video>
    <div id="timerOverlay" class="timer-overlay">
      <div class="timer-number" id="timerNumber">3</div>
    </div>
  </div>

  <button id="takePhotoBtn" disabled>
    📸 Tomar Foto (con temporizador)
  </button>

  <button id="uploadFileBtn" class="file-upload-btn" style="display: none;">
    📁 Seleccionar imagen (fallback)
  </button>

  <div id="status" class="status">🟡 Iniciando cámara...</div>

  <!-- Contenedor para resultados (normal) -->
  <div id="resultContainer" class="result-container">
    <h3>✨ Resultado:</h3>
    <img id="resultImage">
  </div>

  <!-- Contenedor para tarjeta Panini -->
  <div id="paniniContainer" class="card-wrap" style="display: none;">
    <div class="card-container" id="card">
      <img class="card-bg" src="uploads/panini.JPG" alt="Panini WC26 Mexico card background" id="cardBg">
      <div id="cardFallback" class="card-fallback" style="display: none;"></div>
      <img class="card-player-img" id="playerPhoto" src="" alt="Foto jugador">
      <div class="overlay-name" id="playerName">NOMBRE APELLIDO</div>
      <div class="overlay-dob" id="playerDob">00/00/0000</div>
    </div>
    <button id="downloadCardBtn" class="btn-descargar">📥 Descargar Tarjeta</button>
  </div>

  <input type="file" id="fileInput" accept="image/*" style="display: none;">

  <!-- Modal para nombre y fecha (solo para opción panini) -->
  <div id="modalDatos" class="modal">
    <div class="modal-content">
      <h3>🃏 Datos para tu tarjeta Panini</h3>
      <input type="text" id="nombreJugador" placeholder="Nombre completo" maxlength="100">
      <input type="date" id="fechaNacimientoJugador">
      <button id="btnConfirmarDatos" style="background: #3b82f6;">Continuar →</button>
      <button id="btnCancelarDatos" style="background: #94a3b8;">Cancelar</button>
    </div>
  </div>

  <!-- Info del ID de registro -->
  <div id="idInfo" class="id-info"></div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <script>
    (function() {
      const video = document.getElementById("video");
      const takePhotoBtn = document.getElementById("takePhotoBtn");
      const uploadFileBtn = document.getElementById("uploadFileBtn");
      const fileInput = document.getElementById("fileInput");
      const statusDiv = document.getElementById("status");
      const resultContainer = document.getElementById("resultContainer");
      const resultImage = document.getElementById("resultImage");
      const paniniContainer = document.getElementById("paniniContainer");
      const playerPhoto = document.getElementById("playerPhoto");
      const playerName = document.getElementById("playerName");
      const playerDob = document.getElementById("playerDob");
      const cardBg = document.getElementById("cardBg");
      const cardFallback = document.getElementById("cardFallback");
      const downloadCardBtn = document.getElementById("downloadCardBtn");
      const backendInput = document.getElementById("backend");
      const cameraSelect = document.getElementById("cameraSelect");
      const cameraInfo = document.getElementById("cameraInfo");
      const optionSelect = document.getElementById("optionSelect");
      const selectedOptionMsg = document.getElementById("selectedOptionMsg");
      const timerOverlay = document.getElementById("timerOverlay");
      const timerNumber = document.getElementById("timerNumber");
      const modalDatos = document.getElementById("modalDatos");
      const nombreJugador = document.getElementById("nombreJugador");
      const fechaNacimientoJugador = document.getElementById("fechaNacimientoJugador");
      const btnConfirmarDatos = document.getElementById("btnConfirmarDatos");
      const btnCancelarDatos = document.getElementById("btnCancelarDatos");
      const idInfo = document.getElementById("idInfo");

      let currentStream = null;
      let availableDevices = [];
      let timerInterval = null;
      let isTakingPhoto = false;
      let currentRegistroId = null;
      let currentNobgUrl = null;
      let currentNombre = "";
      let currentFecha = "";

      // Manejar error de fondo
      cardBg.onerror = function() {
        cardBg.style.display = 'none';
        cardFallback.style.display = 'block';
      };

      function updateSelectedOptionMessage() {
        const optionValue = optionSelect.value;
        selectedOptionMsg.style.display = 'block';
        
        switch(optionValue) {
          case 'panini':
            selectedOptionMsg.innerHTML = '🃏 Efecto seleccionado: CARTA PANINI - Tu foto se convertirá en una tarjeta coleccionable';
            break;
          case 'messi':
            selectedOptionMsg.innerHTML = '🐐 Efecto seleccionado: FOTO CON MESSI - Aparecerás junto a Lionel Messi';
            break;
          case 'cristiano':
            selectedOptionMsg.innerHTML = '👑 Efecto seleccionado: FOTO CON CRISTIANO RONALDO - Aparecerás junto a CR7';
            break;
          case 'mbappe':
            selectedOptionMsg.innerHTML = '⚡ Efecto seleccionado: FOTO CON MBAPPÉ - Aparecerás junto a Kylian Mbappé';
            break;
          default:
            selectedOptionMsg.innerHTML = 'Selecciona un efecto';
        }
      }

      optionSelect.addEventListener('change', updateSelectedOptionMessage);
      updateSelectedOptionMessage();

      function setStatus(message, type = 'info') {
        statusDiv.textContent = message;
        statusDiv.className = 'status';
        if (type === 'error') statusDiv.classList.add('error');
        if (type === 'success') statusDiv.classList.add('success');
        if (type === 'info') statusDiv.classList.add('info');
        if (type === 'warning') statusDiv.classList.add('warning');
        console.log(`[${type}] ${message}`);
      }

      function showIdInfo(message, isError = false) {
        idInfo.textContent = message;
        idInfo.style.backgroundColor = isError ? '#dc2626' : '#1e293b';
        idInfo.classList.add('show');
        setTimeout(() => {
          idInfo.classList.remove('show');
        }, 5000);
      }

      async function startTimer() {
        return new Promise((resolve) => {
          let count = 3;
          timerNumber.textContent = count;
          timerOverlay.classList.add('active');
          
          timerInterval = setInterval(() => {
            count--;
            if (count >= 1) {
              timerNumber.textContent = count;
              if (navigator.vibrate) navigator.vibrate(100);
            } else {
              clearInterval(timerInterval);
              timerOverlay.classList.remove('active');
              resolve();
            }
          }, 1000);
        });
      }

      async function crearRegistro(nombre, fechaNacimiento) {
        const backend = backendInput.value.trim().replace(/\/$/, "");
        
        try {
          const response = await fetch(backend + "/crear-registro", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              nombre: nombre,
              fecha_nacimiento: fechaNacimiento,
              opcion: "panini"
            })
          });
          
          const data = await response.json();
          
          if (!response.ok) {
            throw new Error(data.error || "Error al crear registro");
          }
          
          return data.id;
        } catch (error) {
          console.error("Error creando registro:", error);
          throw error;
        }
      }

      async function takePhotoWithTimer() {
        if (isTakingPhoto) {
          setStatus("⚠️ Ya hay una foto en proceso", "warning");
          return;
        }
        
        if (!video.videoWidth || !video.videoHeight) {
          setStatus("⚠️ Espera a que la cámara esté lista", "error");
          return;
        }

        const selectedOption = optionSelect.value;
        
        if (selectedOption === "panini") {
          nombreJugador.value = "";
          fechaNacimientoJugador.value = "";
          modalDatos.classList.add("active");
          
          return new Promise((resolve) => {
            const onConfirm = async () => {
              modalDatos.classList.remove("active");
              btnConfirmarDatos.removeEventListener("click", onConfirm);
              btnCancelarDatos.removeEventListener("click", onCancel);
              
              const nombre = nombreJugador.value.trim();
              const fecha = fechaNacimientoJugador.value;
              
              if (!nombre || !fecha) {
                setStatus("❌ Nombre y fecha son requeridos para la tarjeta Panini", "error");
                resolve(false);
                return;
              }
              
              currentNombre = nombre;
              currentFecha = fecha;
              playerName.textContent = nombre.toUpperCase();
              const [year, month, day] = fecha.split('-');
              playerDob.textContent = `${day}/${month}/${year}`;
              
              try {
                setStatus("📝 Creando registro en bitácora...", "info");
                const id = await crearRegistro(nombre, fecha);
                currentRegistroId = id;
                showIdInfo(`✅ Registro creado! ID: ${id} - Guardaremos tu tarjeta`);
                setStatus(`✅ Registro ID: ${id}. Ahora toma tu foto`, "success");
                resolve(true);
                await takePhotoInternal();
              } catch (error) {
                setStatus("❌ Error al crear registro: " + error.message, "error");
                resolve(false);
              }
            };
            
            const onCancel = () => {
              modalDatos.classList.remove("active");
              btnConfirmarDatos.removeEventListener("click", onConfirm);
              btnCancelarDatos.removeEventListener("click", onCancel);
              setStatus("❌ Operación cancelada", "error");
              resolve(false);
            };
            
            btnConfirmarDatos.addEventListener("click", onConfirm);
            btnCancelarDatos.addEventListener("click", onCancel);
          });
        } else {
          currentRegistroId = null;
          await takePhotoInternal();
        }
      }

      async function takePhotoInternal() {
        if (isTakingPhoto) return;
        
        isTakingPhoto = true;
        takePhotoBtn.disabled = true;
        
        setStatus("⏰ Preparando cámara, en 3 segundos se tomará la foto...", "warning");
        
        await startTimer();
        
        setStatus("📸 Tomando foto...", "info");
        
        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const flashOverlay = document.createElement('div');
        flashOverlay.style.position = 'absolute';
        flashOverlay.style.top = '0';
        flashOverlay.style.left = '0';
        flashOverlay.style.width = '100%';
        flashOverlay.style.height = '100%';
        flashOverlay.style.backgroundColor = 'white';
        flashOverlay.style.zIndex = '20';
        flashOverlay.style.pointerEvents = 'none';
        flashOverlay.style.transition = 'opacity 0.2s ease';
        document.querySelector('.video-container').appendChild(flashOverlay);
        
        setTimeout(() => {
          flashOverlay.style.opacity = '0';
          setTimeout(() => flashOverlay.remove(), 300);
        }, 50);
        
        canvas.toBlob(async (blob) => {
          if (blob) {
            await sendToBackend(blob);
          } else {
            setStatus("❌ Error al capturar la foto", "error");
          }
          isTakingPhoto = false;
          takePhotoBtn.disabled = false;
        }, "image/png");
      }

      async function getAvailableCameras() {
        try {
          await navigator.mediaDevices.getUserMedia({ video: true });
          const devices = await navigator.mediaDevices.enumerateDevices();
          const cameras = devices.filter(device => device.kind === 'videoinput');
          console.log("Cámaras encontradas:", cameras);
          if (cameras.length === 0) throw new Error("No se encontraron cámaras");
          return cameras;
        } catch (err) {
          console.error("Error al listar cámaras:", err);
          return [];
        }
      }

      function updateCameraSelector(cameras) {
        cameraSelect.innerHTML = '';
        if (cameras.length === 0) {
          cameraSelect.innerHTML = '<option value="">❌ No se detectaron cámaras</option>';
          cameraSelect.disabled = true;
          cameraInfo.textContent = "No se encontraron dispositivos de cámara";
          return;
        }
        
        cameras.forEach((camera, index) => {
          const option = document.createElement('option');
          option.value = camera.deviceId;
          let label = camera.label || `Cámara ${index + 1}`;
          if (label.toLowerCase().includes('front') || label.toLowerCase().includes('facetime')) {
            label = '🤳 Frontal - ' + label;
          } else if (label.toLowerCase().includes('back') || label.toLowerCase().includes('rear')) {
            label = '📷 Trasera - ' + label;
          } else {
            label = '🎥 ' + label;
          }
          option.textContent = label;
          cameraSelect.appendChild(option);
        });
        cameraSelect.disabled = false;
        cameraInfo.textContent = `📱 ${cameras.length} cámara(s) disponible(s)`;
      }

      async function startCameraWithDevice(deviceId) {
        if (currentStream) {
          currentStream.getTracks().forEach(track => track.stop());
        }
        try {
          const constraints = {
            video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: "environment" }
          };
          setStatus("📷 Iniciando cámara...", "info");
          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = stream;
          currentStream = stream;
          await new Promise((resolve) => {
            video.onloadedmetadata = () => {
              video.play();
              resolve();
            };
          });
          setStatus("✅ Cámara lista. Presiona 'Tomar Foto' y tendrás 3 segundos.", "success");
          takePhotoBtn.disabled = false;
          uploadFileBtn.style.display = 'none';
        } catch (err) {
          console.error("Error al iniciar cámara:", err);
          setStatus("❌ No se pudo iniciar la cámara seleccionada", "error");
          takePhotoBtn.disabled = true;
        }
      }

      async function initialize() {
        setStatus("🔍 Detectando cámaras disponibles...", "info");
        try {
          const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
          tempStream.getTracks().forEach(track => track.stop());
          const cameras = await getAvailableCameras();
          if (cameras.length > 0) {
            updateCameraSelector(cameras);
            const defaultCamera = cameras.find(c => 
              c.label.toLowerCase().includes('back') || c.label.toLowerCase().includes('rear')
            ) || cameras[0];
            cameraSelect.value = defaultCamera.deviceId;
            await startCameraWithDevice(defaultCamera.deviceId);
          } else {
            setStatus("⚠️ No se detectaron cámaras", "error");
            await startCameraWithDevice(null);
          }
        } catch (err) {
          console.error("Error en inicialización:", err);
          setStatus("❌ No se pudo acceder a la cámara. " + err.message, "error");
          takePhotoBtn.disabled = true;
          uploadFileBtn.style.display = 'block';
        }
      }

      cameraSelect.addEventListener('change', async (e) => {
        if (e.target.value) {
          setStatus("🔄 Cambiando de cámara...", "info");
          await startCameraWithDevice(e.target.value);
        }
      });

      function selectFile() {
        fileInput.click();
      }

      async function handleFileSelected(event) {
        const file = event.target.files[0];
        if (!file) return;
        setStatus("📁 Procesando imagen seleccionada...");
        await sendToBackend(file);
        fileInput.value = '';
      }

      async function sendToBackend(imageFile) {
        let backend = backendInput.value.trim();
        if (!backend) {
          setStatus("❌ Configura la URL del backend", "error");
          return;
        }
        backend = backend.replace(/\/$/, "");
        
        const selectedOption = optionSelect.value;
        setStatus(`🔄 Procesando con IA (Opción ${selectedOption})...`);
        takePhotoBtn.disabled = true;
        
        const formData = new FormData();
        formData.append("image", imageFile, "photo.png");
        formData.append("option", selectedOption);
        formData.append("prompt", "");
        if (currentRegistroId) {
          formData.append("registro_id", currentRegistroId);
        }
        
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 120000);
          const res = await fetch(backend + "/edit-image", {
            method: "POST",
            body: formData,
            signal: controller.signal
          });
          clearTimeout(timeoutId);
          
          if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
          const data = await res.json();
          if (data.error) throw new Error(data.error);
          if (!data.image_b64) throw new Error("El backend no devolvió image_b64");
          
          const imageUrl = "data:image/png;base64," + data.image_b64;
          
          // Mostrar según la opción
          if (selectedOption === "panini") {
            // Ocultar resultado normal, mostrar tarjeta
            resultContainer.style.display = "none";
            paniniContainer.style.display = "flex";
            playerPhoto.src = imageUrl;
            setStatus("✅ Tarjeta Panini generada exitosamente", "success");
            if (currentRegistroId) {
              showIdInfo(`🎉 Tarjeta guardada! ID: ${currentRegistroId} - ${currentNombre}`);
            }
          } else {
            // Mostrar imagen normal
            paniniContainer.style.display = "none";
            resultContainer.style.display = "block";
            resultImage.src = imageUrl;
            setStatus("✅ Imagen procesada exitosamente", "success");
          }
          
          resultContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          
        } catch (err) {
          console.error("Error:", err);
          if (err.name === 'AbortError') {
            setStatus("⏰ Timeout: El backend tardó demasiado", "error");
          } else if (err.message.includes('fetch')) {
            setStatus("🔌 No se pudo conectar al backend: " + backend, "error");
          } else {
            setStatus("❌ Error: " + err.message, "error");
          }
        } finally {
          takePhotoBtn.disabled = false;
        }
      }

      // Descargar tarjeta como PNG
      async function downloadCard() {
        const card = document.getElementById("card");
        if (!card) return;
        
        downloadCardBtn.disabled = true;
        downloadCardBtn.textContent = "⏳ Generando...";
        
        try {
          const canvas = await html2canvas(card, {
            scale: 3,
            backgroundColor: null,
            useCORS: true,
            logging: false
          });
          
          const link = document.createElement('a');
          const timestamp = new Date().toISOString().slice(0, 19).replace(/:/g, '-');
          const nombreClean = currentNombre.replace(/\s+/g, '_').substring(0, 30) || "tarjeta";
          link.download = `panini_${nombreClean}_${timestamp}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
          
          setStatus("✨ Tarjeta descargada exitosamente", "success");
        } catch (error) {
          console.error("Error al generar PNG:", error);
          setStatus("❌ Error al generar la imagen", "error");
        } finally {
          downloadCardBtn.disabled = false;
          downloadCardBtn.textContent = "📥 Descargar Tarjeta";
        }
      }

      downloadCardBtn.addEventListener("click", downloadCard);
      takePhotoBtn.addEventListener("click", takePhotoWithTimer);
      uploadFileBtn.addEventListener("click", selectFile);
      fileInput.addEventListener("change", handleFileSelected);
      
      initialize();
      
      navigator.mediaDevices.addEventListener('devicechange', () => {
        setStatus("🔄 Detectando cambios en dispositivos...", "info");
        initialize();
      });
      
    })();
  </script>

</body>

</html>
